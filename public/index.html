<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>OOGA THE BOOGA AI</title>

  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">

</head>

<body>
  <div id="app">

    <aside id="sidebar">

      <div id="sidebar-header">
        <button id="new-chat">+ New Chat</button>
      </div>

      <div id="chat-list">
      </div>

    </aside>


    <div id="chat">

      <div id="messages"></div>

      <div id="bottom">
        <div id="composer">
          <textarea id="prompt" placeholder="Ask anything"></textarea>

          <div id="controls">
            <select id="model">

            </select>

            <button id="think" class="toggle-btn" type="button">
              Think
            </button>

            <button id="stream" class="toggle-btn active" type="button">
              Stream
            </button>


          </div>
        </div>
        <button id="send" aria-label="Send">
          <img src="/svg/send.svg" alt="" aria-hidden="true">
        </button>

      </div>

    </div>

    <script type="module" src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

</body>

</html>
